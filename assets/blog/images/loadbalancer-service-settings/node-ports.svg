<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d6a70"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3402e"/></marker>
    <marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker>
  </defs>
  <rect width="1000" height="480" fill="#ffffff"/>
  <line x1="500" y1="22" x2="500" y2="458" stroke="#d9dde1" stroke-width="2"/>

  <!-- Panel A: true -->
  <text x="250" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#16191c">true (default)</text>
  <rect x="30" y="62" width="190" height="58" rx="8" fill="#f2f5f7" stroke="#8a949c" stroke-width="1.5"/>
  <text x="125" y="97" text-anchor="middle" font-size="16" font-weight="bold" fill="#16191c">Kafka client</text>
  <line x1="125" y1="120" x2="125" y2="168" stroke="#1d6a70" stroke-width="3" marker-end="url(#aT)"/>
  <rect x="30" y="172" width="190" height="64" rx="8" fill="#e8f1f2" stroke="#1d6a70" stroke-width="1.5"/>
  <text x="125" y="199" text-anchor="middle" font-size="16" font-weight="bold" fill="#16191c">Load balancer</text>
  <text x="125" y="223" text-anchor="middle" font-size="14" fill="#1d6a70">client port</text>
  <line x1="125" y1="236" x2="205" y2="352" stroke="#1d6a70" stroke-width="3" marker-end="url(#aT)"/>
  <rect x="280" y="62" width="190" height="58" rx="8" fill="#f2f5f7" stroke="#8a949c" stroke-width="1.5"/>
  <text x="375" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#16191c">Anyone who can</text>
  <text x="375" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#16191c">reach a node</text>
  <line x1="375" y1="120" x2="375" y2="168" stroke="#b3402e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#aR)"/>
  <rect x="280" y="172" width="190" height="84" rx="8" fill="#fbeeeb" stroke="#b3402e" stroke-width="1.5"/>
  <text x="375" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#16191c">Every node</text>
  <text x="375" y="221" text-anchor="middle" font-size="14" fill="#16191c">node port</text>
  <text x="375" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#b3402e">open</text>
  <line x1="375" y1="256" x2="298" y2="352" stroke="#b3402e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#aR)"/>
  <text x="352" y="316" font-size="14" font-weight="bold" fill="#b3402e">side door</text>
  <rect x="140" y="356" width="220" height="60" rx="8" fill="#f2f5f7" stroke="#16191c" stroke-width="1.5"/>
  <text x="250" y="392" text-anchor="middle" font-size="16" font-weight="bold" fill="#16191c">Kroxylicious proxy</text>
  <text x="250" y="446" text-anchor="middle" font-size="14" fill="#555d66">A port on every node bypasses</text>
  <text x="250" y="466" text-anchor="middle" font-size="14" fill="#555d66">the load balancer</text>

  <!-- Panel B: false -->
  <text x="750" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#16191c">false</text>
  <rect x="530" y="62" width="190" height="58" rx="8" fill="#f2f5f7" stroke="#8a949c" stroke-width="1.5"/>
  <text x="625" y="97" text-anchor="middle" font-size="16" font-weight="bold" fill="#16191c">Kafka client</text>
  <line x1="625" y1="120" x2="625" y2="168" stroke="#1d6a70" stroke-width="3" marker-end="url(#aT)"/>
  <rect x="530" y="172" width="190" height="64" rx="8" fill="#e8f1f2" stroke="#1d6a70" stroke-width="1.5"/>
  <text x="625" y="199" text-anchor="middle" font-size="16" font-weight="bold" fill="#16191c">Load balancer</text>
  <text x="625" y="223" text-anchor="middle" font-size="14" fill="#1d6a70">client port</text>
  <line x1="625" y1="236" x2="705" y2="352" stroke="#1d6a70" stroke-width="3" marker-end="url(#aT)"/>
  <rect x="780" y="62" width="190" height="58" rx="8" fill="#f2f5f7" stroke="#8a949c" stroke-width="1.5"/>
  <text x="875" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#16191c">Anyone who can</text>
  <text x="875" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#16191c">reach a node</text>
  <line x1="875" y1="120" x2="875" y2="168" stroke="#8a949c" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#aN)"/>
  <rect x="780" y="172" width="190" height="84" rx="8" fill="#f4f5f6" stroke="#8a949c" stroke-width="1.5"/>
  <text x="875" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#16191c">Every node</text>
  <text x="875" y="221" text-anchor="middle" font-size="14" fill="#16191c">node port released</text>
  <text x="875" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#555d66">connection refused</text>
  <line x1="875" y1="256" x2="798" y2="352" stroke="#c9ced3" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="820" y1="286" x2="852" y2="318" stroke="#b3402e" stroke-width="4"/>
  <line x1="852" y1="286" x2="820" y2="318" stroke="#b3402e" stroke-width="4"/>
  <rect x="640" y="356" width="220" height="60" rx="8" fill="#f2f5f7" stroke="#16191c" stroke-width="1.5"/>
  <text x="750" y="392" text-anchor="middle" font-size="16" font-weight="bold" fill="#16191c">Kroxylicious proxy</text>
  <text x="750" y="446" text-anchor="middle" font-size="14" fill="#555d66">With Local, the health-check port</text>
  <text x="750" y="466" text-anchor="middle" font-size="14" fill="#555d66">stays open</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d6a70"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3402e"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>
  <line x1="500" y1="22" x2="500" y2="418" stroke="#d9dde1" stroke-width="2"/>

  <!-- Panel A: Cluster -->
  <text x="250" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#16191c">Cluster (default)</text>
  <rect x="150" y="62" width="200" height="64" rx="8" fill="#f2f5f7" stroke="#8a949c" stroke-width="1.5"/>
  <text x="250" y="89" text-anchor="middle" font-size="17" font-weight="bold" fill="#16191c">Client</text>
  <text x="250" y="113" text-anchor="middle" font-size="15" fill="#555d66">real client address</text>
  <line x1="250" y1="126" x2="250" y2="186" stroke="#1d6a70" stroke-width="3" marker-end="url(#aT)"/>
  <text x="262" y="161" font-size="13" fill="#555d66">source: client address</text>
  <rect x="130" y="190" width="240" height="74" rx="8" fill="#fbeeeb" stroke="#b3402e" stroke-width="1.5"/>
  <text x="250" y="219" text-anchor="middle" font-size="16" font-weight="bold" fill="#16191c">Node (kube-proxy)</text>
  <text x="250" y="245" text-anchor="middle" font-size="14" fill="#b3402e">rewrites the source</text>
  <line x1="250" y1="264" x2="250" y2="324" stroke="#b3402e" stroke-width="3" marker-end="url(#aR)"/>
  <text x="262" y="299" font-size="13" fill="#b3402e">source: node address</text>
  <rect x="140" y="328" width="220" height="74" rx="8" fill="#fbeeeb" stroke="#b3402e" stroke-width="1.5"/>
  <text x="250" y="357" text-anchor="middle" font-size="16" font-weight="bold" fill="#16191c">Kroxylicious proxy</text>
  <text x="250" y="383" text-anchor="middle" font-size="14" font-weight="bold" fill="#b3402e">sees the node's address</text>

  <!-- Panel B: Local -->
  <text x="750" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#16191c">Local</text>
  <rect x="650" y="62" width="200" height="64" rx="8" fill="#f2f5f7" stroke="#8a949c" stroke-width="1.5"/>
  <text x="750" y="89" text-anchor="middle" font-size="17" font-weight="bold" fill="#16191c">Client</text>
  <text x="750" y="113" text-anchor="middle" font-size="15" fill="#555d66">real client address</text>
  <line x1="750" y1="126" x2="750" y2="186" stroke="#1d6a70" stroke-width="3" marker-end="url(#aT)"/>
  <text x="762" y="161" font-size="13" fill="#555d66">source: client address</text>
  <rect x="630" y="190" width="240" height="74" rx="8" fill="#edf6f0" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="750" y="219" text-anchor="middle" font-size="16" font-weight="bold" fill="#16191c">Node (kube-proxy)</text>
  <text x="750" y="245" text-anchor="middle" font-size="14" fill="#2e7d4f">forwards unchanged</text>
  <line x1="750" y1="264" x2="750" y2="324" stroke="#2e7d4f" stroke-width="3" marker-end="url(#aG)"/>
  <text x="762" y="299" font-size="13" fill="#2e7d4f">source: client address</text>
  <rect x="640" y="328" width="220" height="74" rx="8" fill="#edf6f0" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="750" y="357" text-anchor="middle" font-size="16" font-weight="bold" fill="#16191c">Kroxylicious proxy</text>
  <text x="750" y="383" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d4f">sees the client's address</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
